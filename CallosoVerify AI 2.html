:"Measured quantities are not interchangeable",defsH:["Quantity","Definition used here","Status in this version"],defs:[["Genu thickness","Shortest chord through the centre of the largest inscribed circle whose centre lies in the genu region (anterior 20 % of the straight-line length axis). Reported value = distance between the two genu endpoints.","Computed; editable"],["Splenium thickness","Same rule in the splenium region (posterior 20 %).","Computed; editable"],["Total CC length (straight-line)","Straight-line distance between the most anterior (genu) and most posterior (splenium) points, implemented as the maximal Feret diameter of the CC on the mid-sagittal slice (pose-independent).","Computed; editable"],["Curved centreline length","Length of a polyline through mid-points of chords perpendicular to the length axis. A different quantity from straight-line length; always longer.","Approximate, secondary, not validated"],["Regional height","Vertical (superior\u2013inferior) extent of a sub-region; depends on head pose and is not thickness.","Not computed"],["Mid-sagittal area","Number of CC pixels \xD7 pixel area on the selected slice.","Computed"],["CC volume","Requires segmentation across several sagittal slices (e.g. \xB12.5 mm slab).","Not computed"],["Diffusion-derived metrics (FA, MD \u2026)","Require diffusion-weighted MRI; cannot be derived from T1.","Not applicable"]],protoT:`Measurement protocol ${za}`,proto:["Read voxel spacing and orientation from the NIfTI header (sform preferred, then qform; pixdim fallback is flagged).","Propose the mid-sagittal plane as the L\u2013R slice with the highest mirror symmetry (mean correlation of slices \xB12, 4, 6 mm). The researcher confirms or changes it.","Segment the CC on that slice (experimental region growing from a seed, or manual brush). Only the largest connected piece is measured.","Length axis: maximal Feret diameter; the end with the larger anterior world coordinate is the genu end. Each end is extended to the outer pixel edge.","Genu and splenium regions: anterior and posterior 20 % of the length axis (adjustable in code; record any change).","Thickness: see definitions above. All distances are computed through the image affine in millimetres, so anisotropic and oblique voxels are handled.","After any manual edit, the reported values are the distances between the current endpoints \u2014 exactly what the researcher sees."],protoNote:"This protocol was written by the developers to be explicit and reproducible. It must be compared with, and if necessary replaced by, the protocol approved for your study (e.g. by your supervisor) before any research use.",qcT:"Quality-control checks",qc:["Voxel spacing missing/invalid (fail) or inconsistent between pixdim and affine (review).","Orientation not stored (qform and sform codes 0) (review).",`Sagittal pixel size > ${I.maxInPlaneSpacingMM} mm, voxel anisotropy > ${I.maxAnisotropy}:1, 4-D input (review).`,`Estimated SNR < ${I.minSNR} \u2014 heuristic image-quality flag (review); constant image (fail).`,`Symmetry score < ${I.minSymmetry} or chosen slice > ${I.maxMidlineOffsetMM} mm from the estimate (review).`,`Empty mask (fail); fragmented mask or possible leak (review); area outside ${I.areaMM2.join("\u2013")} mm\xB2 (review).`,"Endpoints > 1.5 px from the CC boundary; thickness lines outside their protocol regions or not crossing the CC; thickness line > half the length (review).",`Length outside ${I.straightLengthMM.join("\u2013")} mm, thickness outside ${I.thicknessMM.join("\u2013")} mm (review). These are broad sanity bounds chosen by the developers, not normative values; adapt them to your population (e.g. children).`],segT:"Automatic segmentation: what was investigated",seg:["FastSurfer-CC (Pollak et al., Deep-MI / DZNE; Imaging Neuroscience 2026) identifies mid-sagittal slices, segments the CC and fornix, localises the anterior and posterior commissures, and produces thickness profiles, sub-divisions and shape metrics. The model weights are published under the Apache-2.0 licence and are downloaded by the FastSurfer toolbox.","It runs inside the FastSurfer pipeline (Python, PyTorch; GPU strongly recommended; conformed 1 mm input) \u2014 it cannot run inside a web page. This build includes a backend adapter that detects a local FastSurfer installation, but no installation was available or tested here. Status: UNAVAILABLE.","FastSurfer-CC's own thickness and length definitions differ from the genu/splenium thickness defined above. If you use it, report its variables under its own definitions rather than mixing them with CVP-0.1 values.","The in-browser 'experimental segmentation' is classical seeded region growing with an Otsu-derived threshold, a 1-pixel morphological opening and hole filling. It is not a trained AI model and has not been validated on real MRI. 'Measure automatically' adds an automatic search for the CC (bright, elongated structure of plausible size near the image centre) so no click is needed; it is equally experimental."],valT:"Validation status (honest summary)",valH:["Component","Evidence","Status"],val:[["NIfTI reading (NIfTI-1/2, gzip, qform/sform, scaling)","Automated round-trip and quaternion tests","Tested (synthetic files)"],["Distance in mm through the affine","Exact tests with anisotropic pixels","Verified"],["Protocol geometry (length, thickness)","Analytic 'dumbbell' shapes, isotropic and anisotropic, rotated 25\xB0: errors \u2264 0.8 mm","Verified on synthetic shapes"],["Full pipeline on synthetic head phantom (1 mm)","vs 0.1 mm analytic ground truth: length 76.16 vs 76.21 mm; genu 10.05 vs 10.40 mm; splenium 9.90 vs 9.90 mm; area 601 vs 603 mm\xB2","Verified on phantom only"],["Curved centreline length","Phantom: 87.4 vs 82.7 mm (5.7 % over-estimate)","Approximate \u2014 do not use as a study variable"],["Region-growing segmentation on real MRI","None","NOT validated"],["Agreement with expert manual tracing","None","NOT validated \u2014 required before research use"],["FastSurfer-CC integration","Adapter written; FastSurfer not installed","Unavailable / untested"]],privT:"Privacy and data handling",priv:"In the hosted web version, MRI files are read and processed entirely inside the browser tab; they are not uploaded anywhere and disappear when the tab is closed. Exports are generated locally. The optional Python backend (for self-hosting) reads uploads in memory only, never writes them to disk, and should be deployed behind HTTPS with an API key and restricted origins. Use de-identified images only; NIfTI headers can still contain free-text descriptions.",limT:"Known limitations",lim:["DICOM series are not read directly \u2014 convert with dcm2niix.","Single-slice measurements: results depend on mid-sagittal slice choice and head pose (no AC\u2013PC alignment is performed).","Thickness values of a few millimetres are close to the voxel size; a one-pixel boundary change alters them by ~1 mm.","The PDF report is generated in English; the interface is bilingual.","Browser testing was automated in Chromium only; Safari/iPadOS file selection is designed for but was not tested on real Apple devices."],ver:`Version ${kr} \xB7 protocol ${za}`},ar:{intro:"\u200FCallosoVerify AI \u0623\u062F\u0627\u0629 \u0628\u062D\u062B\u064A\u0629 \u0644\u0642\u064A\u0627\u0633 \u0634\u0643\u0644 \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A \u0639\u0644\u0649 \u0635\u0648\u0631 \u0627\u0644\u0631\u0646\u064A\u0646 \u0627\u0644\u0645\u063A\u0646\u0627\u0637\u064A\u0633\u064A \u0627\u0644\u0628\u0646\u064A\u0648\u064A\u0629 \u0627\u0644\u0645\u0648\u0632\u0648\u0646\u0629 \u0628\u0640 T1. \u0641\u0643\u0631\u062A\u0647\u0627 \u0627\u0644\u0623\u0633\u0627\u0633\u064A\u0629 \u0623\u0646 \u0627\u0644\u0642\u064A\u0627\u0633 \u0627\u0644\u0622\u0644\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D: \u062A\u0628\u0642\u0649 \u0643\u0644 \u0627\u0644\u062D\u062F\u0648\u062F \u0648\u0646\u0642\u0627\u0637 \u0627\u0644\u0642\u064A\u0627\u0633 \u0638\u0627\u0647\u0631\u0629 \u0648\u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062A\u0639\u062F\u064A\u0644\u060C \u0648\u064A\u064F\u0633\u062C\u064E\u0651\u0644 \u0643\u0644 \u062A\u063A\u064A\u064A\u0631\u060C \u0648\u062A\u064F\u062D\u0641\u0638 \u0627\u0644\u0642\u064A\u0645 \u0627\u0644\u0622\u0644\u064A\u0629 \u0648\u0627\u0644\u0645\u0635\u062D\u062D\u0629 \u062C\u0646\u0628\u064B\u0627 \u0625\u0644\u0649 \u062C\u0646\u0628\u060C \u0648\u062A\u0634\u0631\u062D \u062A\u0646\u0628\u064A\u0647\u0627\u062A \u0627\u0644\u062C\u0648\u062F\u0629 \u0623\u0633\u0628\u0627\u0628\u0647\u0627. \u0648\u0647\u064A \u0645\u062E\u0635\u0635\u0629 \u0644\u0644\u0628\u062D\u062B \u0627\u0644\u0639\u0644\u0645\u064A \u0648\u0644\u064A\u0633\u062A \u0644\u0644\u062A\u0634\u062E\u064A\u0635 \u0627\u0644\u0633\u0631\u064A\u0631\u064A.",defsT:"\u0627\u0644\u0643\u0645\u064A\u0627\u062A \u0627\u0644\u0645\u0642\u0627\u0633\u0629 \u0644\u064A\u0633\u062A \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062A\u0628\u0627\u062F\u0644",defsH:["\u0627\u0644\u0643\u0645\u064A\u0629","\u0627\u0644\u062A\u0639\u0631\u064A\u0641 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645 \u0647\u0646\u0627","\u0627\u0644\u062D\u0627\u0644\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0625\u0635\u062F\u0627\u0631"],defs:[["\u0633\u0645\u0627\u0643\u0629 \u0627\u0644\u0631\u0643\u0628\u0629 (Genu)","\u0623\u0642\u0635\u0631 \u0648\u062A\u0631 \u064A\u0645\u0631 \u0628\u0645\u0631\u0643\u0632 \u0623\u0643\u0628\u0631 \u062F\u0627\u0626\u0631\u0629 \u0645\u062D\u0627\u0637\u0629 \u064A\u0642\u0639 \u0645\u0631\u0643\u0632\u0647\u0627 \u0641\u064A \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0631\u0643\u0628\u0629 (\u0623\u0645\u0627\u0645\u064A 20\u066A \u0645\u0646 \u0645\u062D\u0648\u0631 \u0627\u0644\u0637\u0648\u0644 \u0627\u0644\u0645\u0633\u062A\u0642\u064A\u0645). \u0627\u0644\u0642\u064A\u0645\u0629 = \u0627\u0644\u0645\u0633\u0627\u0641\u0629 \u0628\u064A\u0646 \u0646\u0642\u0637\u062A\u064A \u0627\u0644\u0631\u0643\u0628\u0629.","\u062A\u064F\u062D\u0633\u0628\u061B \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062A\u0639\u062F\u064A\u0644"],["\u0633\u0645\u0627\u0643\u0629 \u0627\u0644\u0637\u062D\u0627\u0644 (Splenium)","\u0627\u0644\u0642\u0627\u0639\u062F\u0629 \u0646\u0641\u0633\u0647\u0627 \u0641\u064A \u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u0637\u062D\u0627\u0644 (\u062E\u0644\u0641\u064A 20\u066A).","\u062A\u064F\u062D\u0633\u0628\u061B \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062A\u0639\u062F\u064A\u0644"],["\u0627\u0644\u0637\u0648\u0644 \u0627\u0644\u0643\u0644\u064A (\u062E\u0637 \u0645\u0633\u062A\u0642\u064A\u0645)","\u0627\u0644\u0645\u0633\u0627\u0641\u0629 \u0627\u0644\u0645\u0633\u062A\u0642\u064A\u0645\u0629 \u0628\u064A\u0646 \u0623\u0628\u0639\u062F \u0646\u0642\u0637\u0629 \u0623\u0645\u0627\u0645\u064A\u0629 (\u0627\u0644\u0631\u0643\u0628\u0629) \u0648\u0623\u0628\u0639\u062F \u0646\u0642\u0637\u0629 \u062E\u0644\u0641\u064A\u0629 (\u0627\u0644\u0637\u062D\u0627\u0644)\u060C \u0645\u064F\u0646\u0641\u064E\u0651\u0630\u0629 \u0643\u0623\u0642\u0635\u0649 \u0642\u0637\u0631 \u0641\u064A\u0631\u064A\u0647 \u0644\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A \u0641\u064A \u0627\u0644\u0634\u0631\u064A\u062D\u0629 \u0627\u0644\u0648\u0633\u0637\u0649.","\u064A\u064F\u062D\u0633\u0628\u061B \u0642\u0627\u0628\u0644 \u0644\u0644\u062A\u0639\u062F\u064A\u0644"],["\u0637\u0648\u0644 \u0627\u0644\u062E\u0637 \u0627\u0644\u0645\u0631\u0643\u0632\u064A \u0627\u0644\u0645\u0646\u062D\u0646\u064A","\u0637\u0648\u0644 \u062E\u0637 \u0645\u062A\u0639\u062F\u062F \u064A\u0645\u0631 \u0628\u0645\u0646\u062A\u0635\u0641\u0627\u062A \u0623\u0648\u062A\u0627\u0631 \u0639\u0645\u0648\u062F\u064A\u0629 \u0639\u0644\u0649 \u0645\u062D\u0648\u0631 \u0627\u0644\u0637\u0648\u0644. \u0643\u0645\u064A\u0629 \u0645\u062E\u062A\u0644\u0641\u0629 \u0639\u0646 \u0627\u0644\u0637\u0648\u0644 \u0627\u0644\u0645\u0633\u062A\u0642\u064A\u0645 \u0648\u0623\u0637\u0648\u0644 \u0645\u0646\u0647 \u062F\u0627\u0626\u0645\u064B\u0627.","\u062A\u0642\u0631\u064A\u0628\u064A\u060C \u062B\u0627\u0646\u0648\u064A\u060C \u063A\u064A\u0631 \u0645\u062A\u062D\u0642\u0642 \u0645\u0646\u0647"],["\u0627\u0644\u0627\u0631\u062A\u0641\u0627\u0639 \u0627\u0644\u0625\u0642\u0644\u064A\u0645\u064A","\u0627\u0644\u0627\u0645\u062A\u062F\u0627\u062F \u0627\u0644\u0631\u0623\u0633\u064A \u0644\u0645\u0646\u0637\u0642\u0629 \u0641\u0631\u0639\u064A\u0629\u061B \u064A\u0639\u062A\u0645\u062F \u0639\u0644\u0649 \u0648\u0636\u0639\u064A\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0644\u064A\u0633 \u0633\u0645\u0627\u0643\u0629.","\u0644\u0627 \u064A\u064F\u062D\u0633\u0628"],["\u0627\u0644\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0633\u0647\u0645\u064A\u0629 \u0627\u0644\u0648\u0633\u0637\u0649","\u0639\u062F\u062F \u0628\u0643\u0633\u0644\u0627\u062A \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A \xD7 \u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u0628\u0643\u0633\u0644 \u0641\u064A \u0627\u0644\u0634\u0631\u064A\u062D\u0629 \u0627\u0644\u0645\u062E\u062A\u0627\u0631\u0629.","\u062A\u064F\u062D\u0633\u0628"],["\u062D\u062C\u0645 \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A","\u064A\u062A\u0637\u0644\u0628 \u062A\u0642\u0633\u064A\u0645\u064B\u0627 \u0639\u0628\u0631 \u0639\u062F\u0629 \u0634\u0631\u0627\u0626\u062D \u0633\u0647\u0645\u064A\u0629.","\u0644\u0627 \u064A\u064F\u062D\u0633\u0628"],["\u0645\u0642\u0627\u064A\u064A\u0633 \u0627\u0644\u0627\u0646\u062A\u0634\u0627\u0631 (FA\u060C MD\u2026)","\u062A\u062A\u0637\u0644\u0628 \u0631\u0646\u064A\u0646 \u0627\u0644\u0627\u0646\u062A\u0634\u0627\u0631\u061B \u0644\u0627 \u062A\u064F\u0633\u062A\u062E\u0631\u062C \u0645\u0646 T1.","\u063A\u064A\u0631 \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062A\u0637\u0628\u064A\u0642"]],protoT:`\u0628\u0631\u0648\u062A\u0648\u0643\u0648\u0644 \u0627\u0644\u0642\u064A\u0627\u0633 ${za}`,proto:["\u0642\u0631\u0627\u0621\u0629 \u062D\u062C\u0645 \u0627\u0644\u0641\u0648\u0643\u0633\u0644 \u0648\u0627\u0644\u0627\u062A\u062C\u0627\u0647 \u0645\u0646 \u062A\u0631\u0648\u064A\u0633\u0629 NIfTI (sform \u0623\u0648\u0644\u064B\u0627 \u062B\u0645 qform\u060C \u0648\u064A\u064F\u0646\u0628\u064E\u0651\u0647 \u0639\u0646\u062F \u0627\u0644\u0627\u0639\u062A\u0645\u0627\u062F \u0639\u0644\u0649 pixdim).","\u0627\u0642\u062A\u0631\u0627\u062D \u0627\u0644\u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0633\u0647\u0645\u064A \u0627\u0644\u0623\u0648\u0633\u0637 \u0643\u0634\u0631\u064A\u062D\u0629 \u064A\u0645\u064A\u0646\u2013\u064A\u0633\u0627\u0631 \u0630\u0627\u062A \u0623\u0639\u0644\u0649 \u062A\u0646\u0627\u0638\u0631 \u0645\u0631\u0622\u062A\u064A\u060C \u0648\u064A\u0624\u0643\u062F\u0647 \u0627\u0644\u0628\u0627\u062D\u062B \u0623\u0648 \u064A\u063A\u064A\u0651\u0631\u0647.","\u062A\u0642\u0633\u064A\u0645 \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A \u0639\u0644\u0649 \u062A\u0644\u0643 \u0627\u0644\u0634\u0631\u064A\u062D\u0629 (\u062A\u0646\u0645\u064A\u0629 \u0645\u0646\u0637\u0642\u0629 \u062A\u062C\u0631\u064A\u0628\u064A\u0629 \u0623\u0648 \u0641\u0631\u0634\u0627\u0629 \u064A\u062F\u0648\u064A\u0629). \u064A\u064F\u0642\u0627\u0633 \u0623\u0643\u0628\u0631 \u062C\u0632\u0621 \u0645\u062A\u0635\u0644 \u0641\u0642\u0637.","\u0645\u062D\u0648\u0631 \u0627\u0644\u0637\u0648\u0644: \u0623\u0642\u0635\u0649 \u0642\u0637\u0631 \u0641\u064A\u0631\u064A\u0647\u061B \u0627\u0644\u0637\u0631\u0641 \u0630\u0648 \u0627\u0644\u0625\u062D\u062F\u0627\u062B\u064A \u0627\u0644\u0623\u0645\u0627\u0645\u064A \u0627\u0644\u0623\u0643\u0628\u0631 \u0647\u0648 \u0637\u0631\u0641 \u0627\u0644\u0631\u0643\u0628\u0629.","\u0645\u0646\u0637\u0642\u062A\u0627 \u0627\u0644\u0631\u0643\u0628\u0629 \u0648\u0627\u0644\u0637\u062D\u0627\u0644: 20\u066A \u0627\u0644\u0623\u0645\u0627\u0645\u064A\u0629 \u064820\u066A \u0627\u0644\u062E\u0644\u0641\u064A\u0629 \u0645\u0646 \u0645\u062D\u0648\u0631 \u0627\u0644\u0637\u0648\u0644.","\u0627\u0644\u0633\u0645\u0627\u0643\u0629 \u0643\u0645\u0627 \u0641\u064A \u0627\u0644\u062A\u0639\u0631\u064A\u0641\u0627\u062A \u0623\u0639\u0644\u0627\u0647. \u062A\u064F\u062D\u0633\u0628 \u0643\u0644 \u0627\u0644\u0645\u0633\u0627\u0641\u0627\u062A \u0639\u0628\u0631 \u0645\u0635\u0641\u0648\u0641\u0629 \u0627\u0644\u0635\u0648\u0631\u0629 \u0628\u0627\u0644\u0645\u0644\u064A\u0645\u062A\u0631.","\u0628\u0639\u062F \u0623\u064A \u062A\u0639\u062F\u064A\u0644 \u064A\u062F\u0648\u064A\u060C \u062A\u0643\u0648\u0646 \u0627\u0644\u0642\u064A\u0645 \u0627\u0644\u0645\u0628\u0644\u0651\u063A \u0639\u0646\u0647\u0627 \u0647\u064A \u0627\u0644\u0645\u0633\u0627\u0641\u0627\u062A \u0628\u064A\u0646 \u0627\u0644\u0646\u0642\u0627\u0637 \u0627\u0644\u062D\u0627\u0644\u064A\u0629 \u062A\u0645\u0627\u0645\u064B\u0627 \u0643\u0645\u0627 \u064A\u0631\u0627\u0647\u0627 \u0627\u0644\u0628\u0627\u062D\u062B."],protoNote:"\u0643\u062A\u0628 \u0627\u0644\u0645\u0637\u0648\u0631\u0648\u0646 \u0647\u0630\u0627 \u0627\u0644\u0628\u0631\u0648\u062A\u0648\u0643\u0648\u0644 \u0644\u064A\u0643\u0648\u0646 \u0635\u0631\u064A\u062D\u064B\u0627 \u0648\u0642\u0627\u0628\u0644\u064B\u0627 \u0644\u0644\u062A\u0643\u0631\u0627\u0631. \u064A\u062C\u0628 \u0645\u0642\u0627\u0631\u0646\u062A\u0647 \u0628\u0627\u0644\u0628\u0631\u0648\u062A\u0648\u0643\u0648\u0644 \u0627\u0644\u0645\u0639\u062A\u0645\u062F \u0644\u062F\u0631\u0627\u0633\u062A\u0643 (\u0645\u0646 \u0627\u0644\u0645\u0634\u0631\u0641 \u0645\u062B\u0644\u064B\u0627) \u0648\u0627\u0633\u062A\u0628\u062F\u0627\u0644\u0647 \u0639\u0646\u062F \u0627\u0644\u062D\u0627\u062C\u0629 \u0642\u0628\u0644 \u0623\u064A \u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0628\u062D\u062B\u064A.",qcT:"\u0641\u062D\u0648\u0635 \u0636\u0628\u0637 \u0627\u0644\u062C\u0648\u062F\u0629",qc:["\u062D\u062C\u0645 \u0641\u0648\u0643\u0633\u0644 \u0645\u0641\u0642\u0648\u062F/\u063A\u064A\u0631 \u0635\u0627\u0644\u062D (\u0641\u0634\u0644) \u0623\u0648 \u063A\u064A\u0631 \u0645\u062A\u0633\u0642 \u0628\u064A\u0646 pixdim \u0648\u0627\u0644\u0645\u0635\u0641\u0648\u0641\u0629 (\u0645\u0631\u0627\u062C\u0639\u0629).","\u0627\u0644\u0627\u062A\u062C\u0627\u0647 \u063A\u064A\u0631 \u0645\u062D\u0641\u0648\u0638 \u0641\u064A \u0627\u0644\u0645\u0644\u0641 (\u0645\u0631\u0627\u062C\u0639\u0629).",`\u0628\u0643\u0633\u0644 \u0633\u0647\u0645\u064A \u0623\u0643\u0628\u0631 \u0645\u0646 ${I.maxInPlaneSpacingMM} \u0645\u0645\u060C \u0623\u0648 \u0639\u062F\u0645 \u062A\u0633\u0627\u0648\u064A \u0623\u0628\u0639\u0627\u062F \u0627\u0644\u0641\u0648\u0643\u0633\u0644 \u0623\u0643\u062B\u0631 \u0645\u0646 ${I.maxAnisotropy}:1\u060C \u0623\u0648 \u0635\u0648\u0631\u0629 \u0631\u0628\u0627\u0639\u064A\u0629 \u0627\u0644\u0623\u0628\u0639\u0627\u062F (\u0645\u0631\u0627\u062C\u0639\u0629).`,`\u0646\u0633\u0628\u0629 \u0625\u0634\u0627\u0631\u0629/\u0636\u062C\u064A\u062C \u062A\u0642\u062F\u064A\u0631\u064A\u0629 \u0623\u0642\u0644 \u0645\u0646 ${I.minSNR} (\u0645\u0631\u0627\u062C\u0639\u0629)\u061B \u0635\u0648\u0631\u0629 \u062B\u0627\u0628\u062A\u0629 \u0627\u0644\u0634\u062F\u0629 (\u0641\u0634\u0644).`,`\u062F\u0631\u062C\u0629 \u062A\u0646\u0627\u0638\u0631 \u0623\u0642\u0644 \u0645\u0646 ${I.minSymmetry} \u0623\u0648 \u0634\u0631\u064A\u062D\u0629 \u062A\u0628\u0639\u062F \u0623\u0643\u062B\u0631 \u0645\u0646 ${I.maxMidlineOffsetMM} \u0645\u0645 \u0639\u0646 \u0627\u0644\u062A\u0642\u062F\u064A\u0631 (\u0645\u0631\u0627\u062C\u0639\u0629).`,`\u0642\u0646\u0627\u0639 \u0641\u0627\u0631\u063A (\u0641\u0634\u0644)\u061B \u0642\u0646\u0627\u0639 \u0645\u062C\u0632\u0623 \u0623\u0648 \u062A\u0633\u0631\u0628 \u0645\u062D\u062A\u0645\u0644 (\u0645\u0631\u0627\u062C\u0639\u0629)\u061B \u0645\u0633\u0627\u062D\u0629 \u062E\u0627\u0631\u062C ${I.areaMM2.join("\u2013")} \u0645\u0645\xB2 (\u0645\u0631\u0627\u062C\u0639\u0629).`,"\u0646\u0642\u0627\u0637 \u062A\u0628\u0639\u062F \u0623\u0643\u062B\u0631 \u0645\u0646 1.5 \u0628\u0643\u0633\u0644 \u0639\u0646 \u0627\u0644\u062D\u062F\u0648\u062F\u061B \u062E\u0637\u0648\u0637 \u0633\u0645\u0627\u0643\u0629 \u062E\u0627\u0631\u062C \u0645\u0646\u0627\u0637\u0642\u0647\u0627 \u0623\u0648 \u0644\u0627 \u062A\u0639\u0628\u0631 \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A (\u0645\u0631\u0627\u062C\u0639\u0629).",`\u0637\u0648\u0644 \u062E\u0627\u0631\u062C ${I.straightLengthMM.join("\u2013")} \u0645\u0645 \u0623\u0648 \u0633\u0645\u0627\u0643\u0629 \u062E\u0627\u0631\u062C ${I.thicknessMM.join("\u2013")} \u0645\u0645 (\u0645\u0631\u0627\u062C\u0639\u0629). \u0647\u0630\u0647 \u062D\u062F\u0648\u062F \u0645\u0639\u0642\u0648\u0644\u064A\u0629 \u0648\u0627\u0633\u0639\u0629 \u0648\u0644\u064A\u0633\u062A \u0642\u064A\u0645\u064B\u0627 \u0645\u0639\u064A\u0627\u0631\u064A\u0629\u061B \u0639\u062F\u0651\u0644\u0647\u0627 \u0644\u0639\u064A\u0646\u062A\u0643 (\u0627\u0644\u0623\u0637\u0641\u0627\u0644 \u0645\u062B\u0644\u064B\u0627).`],segT:"\u0627\u0644\u062A\u0642\u0633\u064A\u0645 \u0627\u0644\u0622\u0644\u064A: \u0645\u0627 \u0627\u0644\u0630\u064A \u0641\u064F\u062D\u0635",seg:["\u200FFastSurfer-CC (Pollak \u0648\u0632\u0645\u0644\u0627\u0624\u0647\u060C Deep-MI / DZNE\u061B Imaging Neuroscience 2026) \u064A\u062D\u062F\u062F \u0627\u0644\u0634\u0631\u0627\u0626\u062D \u0627\u0644\u0633\u0647\u0645\u064A\u0629 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u064A\u0642\u0633\u0651\u0645 \u0627\u0644\u062C\u0633\u0645 \u0627\u0644\u062B\u0641\u0646\u064A \u0648\u0627\u0644\u0642\u0628\u0648 \u0648\u064A\u062D\u062F\u062F \u0627\u0644\u0635\u0648\u0627\u0631\u064A\u0646 \u0627\u0644\u0623\u0645\u0627\u0645\u064A \u0648\u0627\u0644\u062E\u0644\u0641\u064A \u0648\u064A\u0646\u062A\u062C \u0645\u0644\u0641\u0627\u062A \u0627\u0644\u0633\u0645\u0627\u0643\u0629 \u0648\u0627\u0644\u062A\u0642\u0633\u064A\u0645\u0627\u062A \u0627\u0644\u064
